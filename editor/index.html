<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>書く・つくる — Takayuki Sakai</title>
<link rel="stylesheet" href="/editor/editor.css">
</head>
<body>
<aside class="sidebar" id="sidebar">
  <a class="brand" href="/" target="_blank" rel="noopener"><span class="brand-mark">堺</span><span>Takayuki Sakai<small>書く・つくる</small></span></a>
  <p class="nav-label">ページ</p><nav id="pages" aria-label="ページ"></nav>
  <div class="nav-label nav-heading"><span>作品</span><button id="new-work" class="icon-button" aria-label="作品を追加">＋</button></div>
  <nav id="works" aria-label="作品"></nav>
  <button class="nav-item order-link" id="order-open">⇅ <span>作品の並び順</span></button>
  <div class="sidebar-bottom"><span class="local-dot"></span>このMacで編集<span>下書きは自動保存されます</span></div>
</aside>
<div class="workspace">
  <header class="toolbar">
    <button class="icon-button menu-button" id="menu" aria-label="ページ一覧を開閉">☰</button>
    <span id="breadcrumb">読み込み中…</span>
    <div class="toolbar-actions"><span id="save-status" role="status" aria-live="polite">接続しています</span><button id="preview-toggle">見え方</button><button class="primary" id="apply">プレビューに反映</button></div>
  </header>
  <div class="notice" id="notice" role="alert" hidden></div>
  <div class="desk">
    <main id="document" class="document"><p class="loading">ページを開いています…</p></main>
    <aside class="preview-panel" id="preview-panel" hidden><div class="preview-bar"><span>反映後のサイト</span><a id="preview-link" href="/" target="_blank" rel="noopener">別の画面で開く ↗</a></div><iframe id="preview-frame" title="サイトのプレビュー" src="about:blank"></iframe></aside>
  </div>
</div>
<dialog id="media-dialog"><div class="dialog-heading"><h2>写真・映像を選ぶ</h2><button id="media-close" class="icon-button" aria-label="閉じる">×</button></div><label class="upload-button">＋ ファイルを追加<input id="upload" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4" hidden></label><p class="quiet">JPEG・PNG・WebP・GIF・MP4。32MBまで。</p><div id="media-grid" class="media-grid"></div></dialog>
<dialog id="link-dialog"><form id="link-form"><h2>リンクを入れる</h2><label>表示することば<input id="link-text" required></label><label>リンク先<input id="link-url" type="text" placeholder="https://…" required></label><div class="dialog-actions"><button type="button" id="link-cancel">キャンセル</button><button class="primary" type="submit">入れる</button></div></form></dialog>
<div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="undo">元に戻す</button></div>
<script src="/editor/editor.js"></script>
</body>
</html>

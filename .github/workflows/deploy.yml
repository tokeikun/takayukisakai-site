name: build-and-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site from content
        run: |
          python3 build.py
          mkdir -p _site
          cp index.html admin.html robots.txt sitemap.xml _site/
          cp -R works _site/works
          cp -R assets _site/assets
          for f in content/pages/*.md; do slug=$(grep '^slug:' "$f" | head -1 | cut -d: -f2 | tr -d ' '); [ -n "$slug" ] && [ -d "$slug" ] && cp -R "$slug" "_site/$slug"; done
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
